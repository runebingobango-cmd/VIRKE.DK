# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare project-relative links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import posixpath
          import re

          root = Path("dist")
          assert (root / "index.html").is_file()
          pattern = re.compile(r"""((?:href|src)=["']|url\(\s*["']?)/(?!/)([^"'()\s]*)""")
          for file in root.rglob("*"):
              if file.suffix not in {".css", ".html"}:
                  continue
              prefix = posixpath.relpath(".", file.parent.relative_to(root).as_posix())
              file.write_text(pattern.sub(lambda match: match[1] + prefix + "/" + match[2], file.read_text()))
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
